name: R3 Acceptance Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Native host acceptance contract
        run: node tests/test_native_host_acceptance.mjs

      - name: Live host acceptance harness contract
        run: node tests/test_hakim_live_host_acceptance.mjs

      - name: Native acceptance checker
        run: node scripts/check_native_host_acceptance.mjs

      - name: Install-plan contract
        run: node tests/test_hakim_install_plan.mjs

      - name: Public first-run truth contract
        run: node tests/test_public_first_run_contract.mjs
