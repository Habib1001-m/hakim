name: Public CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Run canonical repository gate
        run: npm test

      # These steps are diagnostics only. package.json remains the authority for
      # the canonical gate; diagnostics run only after a failure to localize it.
      - name: Diagnose behavior/runtime contracts on failure
        if: failure()
        run: |
          node tests/test_rule_copies.js
          node tests/test_behavioral_contract.mjs
          node tests/test_claude_runtime_kernel.mjs
          node tests/test_runtime_trace_contract.mjs
          node tests/test_rule_missing_section.js
          node tests/test_plugin_smoke.js

      - name: Diagnose host projection contracts on failure
        if: failure()
        run: |
          node tests/test_claude_diagnostic_hook.js
          node scripts/check_codex_skill_projection.mjs --json
          node scripts/check_claude_skill_projection.mjs --json
          node scripts/check_copilot_instructions_projection.mjs --json
          node tests/test_cross_adapter_conformance.js

      - name: Diagnose repository truth contracts on failure
        if: failure()
        run: |
          node tests/test_upstream_relationship.js
          node tests/test_hakim_pr_guardian.mjs
          node tests/test_hakim_review_pr.mjs
          node tests/test_hakim_doctor.mjs
          node tests/test_native_host_acceptance.mjs
          node tests/test_hakim_live_host_acceptance.mjs
          node scripts/check_native_host_acceptance.mjs
          node tests/test_hakim_install_plan.mjs
          node tests/test_public_first_run_contract.mjs
          node tests/test_hakim_host_preflight.mjs
          node tests/test_hakim_codex_launch.mjs
          node tests/test_hakim_claude_launch.mjs
          node tests/test_hakim_copilot_install.mjs
          node tests/test_hakim_copilot_remove.mjs
          node tests/test_generate_conformance_packets_no_git.js
          node tests/test_structured_metadata.js
          node tests/test_hakim_guarded_session.mjs
          npm run check:workflow-policy
          node scripts/check_public_repository_boundary.mjs
          node scripts/check_public_package_surface.mjs

      - name: Diagnose Python contracts on failure
        if: failure()
        run: npm run test:public:py

      - name: Diagnose release artifacts on failure
        if: failure()
        run: npm run package:release

  node22-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run Node 22 compatibility gate
        run: npm run test:node-compat

  node26-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Run Node 26 compatibility gate
        run: npm run test:node-compat
