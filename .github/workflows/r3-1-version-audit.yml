name: R3.1 Version Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit exact beta.4 branch truth
        run: |
          git clone -q --depth 1 --branch agent/r3-1-observable-checkpoints https://github.com/Habib1001-m/hakim.git /tmp/r31
          cd /tmp/r31
          echo "VERSION=$(cat core/hakim-skill/VERSION)"
          echo "CANONICAL_SHA256=$(sha256sum core/hakim-skill/SKILL.md | awk '{print $1}')"
          echo "=== BETA3 REFERENCES ==="
          git grep -n '1.0.0-beta.3' || true
          echo "=== FIRST-RUN ==="
          node tests/test_public_first_run_contract.mjs
          echo "=== PRODUCT TRUTH ==="
          node tests/test_product_truth_contract.mjs
          echo "=== BEHAVIORAL CONTRACT ==="
          node tests/test_behavioral_contract.mjs

      - name: Pinned action reference for workflow policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/r3-1-observable-checkpoints
