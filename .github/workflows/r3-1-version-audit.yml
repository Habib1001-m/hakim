name: R3.1 Version Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Print remaining beta.3 OpenCode manifest records
        run: |
          git clone -q https://github.com/Habib1001-m/hakim.git /tmp/beta3
          git -C /tmp/beta3 checkout -q --detach a697b5e24d05e38b925d849fee4a02daa623c24b
          cd /tmp/beta3
          node --input-type=module - <<'NODE'
          import { buildOpenCodeBundle, manifestFromBundle } from './scripts/lib/opencode_bundle.mjs';
          const manifest = manifestFromBundle(buildOpenCodeBundle(process.cwd()));
          for (const record of manifest.files.filter((item) => item.target_relative.includes('/loaders/') || item.target_relative === '.opencode/plugins/hakim.js')) {
            console.log(JSON.stringify(record));
          }
          NODE

      - name: Pinned action reference for workflow policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/r3-1-observable-checkpoints
